<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1680" viewBox="0 0 2400 1680" role="img" aria-labelledby="title desc">
<title id="title">SAWAARI technical flowchart</title>
<desc id="desc">A smartphone supplies two streams: live GPS telemetry through Socket.IO and Node.js to a passenger map; and camera frames with GPS to Python, OpenCV and YOLO. Accepted detections pass a time-gap filter, produce local evidence, and enter the incident backend and government dashboard. Route selection, ETA and spatial de-duplication are planned.</desc>
